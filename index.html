<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Shorts Studio — Auto Video</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 16px 50px}.hero{text-align:center;padding:22px 0}.badge{color:#aab2c0;border:1px solid #30343d;border-radius:999px;padding:7px 12px;font-size:12px}.hero h1{font-size:clamp(30px,9vw,48px);line-height:1;margin:18px 0 10px}.hero p{color:#9299a5}.card{background:#101217;border:1px solid #252a33;border-radius:20px;padding:18px;margin-top:14px}.label{font-size:13px;color:#b9bec8;display:block;margin:0 0 8px}input,textarea,select{width:100%;background:#090b0f;border:1px solid #2a2f38;border-radius:13px;color:#fff;padding:14px;font:inherit}textarea{min-height:260px;resize:vertical}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}.btn{border:1px solid #303540;border-radius:12px;padding:13px;font:inherit;font-weight:750;background:#1a1d23;color:#fff;cursor:pointer}.primary{background:#fff;color:#090a0d}.btn:disabled{opacity:.5;cursor:wait}.status{margin-top:14px;padding:14px;border:1px solid #252a33;border-radius:13px;background:#0b0e13}.bar{height:9px;background:#252a33;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#fff;transition:.3s}.video{width:100%;max-width:360px;display:block;margin:18px auto 0;border-radius:16px;background:#000}.download{display:block;margin-top:10px;text-align:center;background:#fff;color:#000;text-decoration:none;padding:13px;border-radius:12px;font-weight:800}.hint{font-size:12px;color:#737b88;line-height:1.5}.ok{color:#a9f0bd}.warn{color:#ffd98a}</style></head>
<body><main class="wrap"><section class="hero"><span class="badge">CHATGPT → SCENES → MP4</span><h1>Idea → Script → Video</h1><p>Generate a script, create animated scenes, then convert the result to MP4 in your browser.</p></section>
<section class="card"><label class="label">🎯 Video topic</label><input id="topic" placeholder="Example: 7 free AI tools worth using in 2026"><div class="row"><button id="scriptBtn" class="btn primary">🧠 Create Script</button><select id="language"><option>English</option><option>Bahasa Indonesia</option></select></div>
<label class="label" style="margin-top:14px">📝 Script + scene plan</label><textarea id="script" placeholder="Click Create Script..."></textarea><div class="row"><button id="regen" class="btn">🔄 Regenerate</button><button id="copy" class="btn">📋 Copy</button></div><div class="row"><button id="render" class="btn primary">🎬 Render MP4</button><button id="voice" class="btn">🔊 Read Voiceover</button></div>
<div id="status" class="status" style="display:none"><b id="statusText">Preparing...</b><div class="bar"><div id="fill" class="fill"></div></div></div><video id="preview" class="video" controls playsinline style="display:none"></video><a id="download" class="download" style="display:none"></a>
<p class="hint"><span class="ok">✓</span> Video rendering and WebM→MP4 conversion happen in the browser. <span class="warn">Current MP4 contains video only; browser voice playback is preview-only.</span></p></section></main>
<script>
const $=x=>document.querySelector(x),topic=$('#topic'),script=$('#script'),language=$('#language'),status=$('#status'),statusText=$('#statusText'),fill=$('#fill'),preview=$('#preview'),download=$('#download');
function setStatus(t,p){status.style.display='block';statusText.textContent=t;fill.style.width=p+'%'}
async function makeScript(){if(!topic.value.trim())return alert('Enter a topic first.');$('#scriptBtn').disabled=true;setStatus('🧠 Creating script...',20);try{const r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:language.value,duration:60})});const d=await r.json();if(!r.ok)throw Error(d.error||'Script generation failed');script.value=d.script;setStatus('✅ Script ready — press Render MP4.',100)}catch(e){setStatus('❌ '+e.message,0)}finally{$('#scriptBtn').disabled=false}}
$('#scriptBtn').onclick=makeScript;$('#regen').onclick=makeScript;$('#copy').onclick=async()=>{if(!script.value.trim())return alert('Script is empty.');await navigator.clipboard.writeText(script.value);setStatus('✅ Copied.',100)};
$('#voice').onclick=()=>{if(!script.value.trim())return alert('Create a script first.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(script.value.replace(/SCENE|VISUAL|NARRATION/gi,''));u.lang=language.value==='English'?'en-US':'id-ID';u.rate=.98;speechSynthesis.speak(u);setStatus('🔊 Playing browser voice preview...',100)};
function scenesFromText(t){const blocks=t.split(/(?=SCENE\s*\d+)/i).filter(x=>x.trim());return(blocks.length?blocks:[t]).slice(0,12).map((x,i)=>{const n=(x.match(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|$)/i)||[])[1]||x.replace(/VISUAL[\s\S]*/i,'');const v=(x.match(/VISUAL\s*[:\-]\s*([\s\S]*?)(?=NARRATION|$)/i)||[])[1]||'';return{n:n.trim(),v:v.trim(),i}})}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines){const words=String(text).replace(/\s+/g,' ').trim().split(' ');let line='',lines=[];for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=w;if(lines.length===maxLines)break}else line=test}if(line&&lines.length<maxLines)lines.push(line);const top=y-(lines.length-1)*lineHeight/2;lines.forEach((l,i)=>ctx.fillText(l,x,top+i*lineHeight))}
async function recordVideo(){const scenes=scenesFromText(script.value),canvas=document.createElement('canvas');canvas.width=720;canvas.height=1280;const ctx=canvas.getContext('2d');const stream=canvas.captureStream(30);const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6000000});const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise(resolve=>rec.onstop=resolve);rec.start();for(let s=0;s<scenes.length;s++){setStatus('🎥 Rendering scene '+(s+1)+'/'+scenes.length,10+(s/scenes.length)*65);const start=performance.now(),duration=5000;await new Promise(resolve=>{function frame(now){const p=Math.min(1,(now-start)/duration),z=1+p*.07;ctx.fillStyle='#07080b';ctx.fillRect(0,0,720,1280);const g=ctx.createLinearGradient(0,0,720,1280);g.addColorStop(0,'#171b2a');g.addColorStop(1,'#05060a');ctx.fillStyle=g;ctx.fillRect(0,0,720,1280);ctx.save();ctx.translate(360,640);ctx.scale(z,z);ctx.translate(-360,-640);ctx.fillStyle='#fff';ctx.font='800 48px system-ui';ctx.textAlign='center';wrap(ctx,scenes[s].v||('Scene '+(s+1)),360,560,600,62,5);ctx.restore();ctx.fillStyle='#aeb5c1';ctx.font='500 26px system-ui';ctx.textAlign='center';ctx.fillText((s+1)+' / '+scenes.length,360,1190);if(p<1)requestAnimationFrame(frame);else resolve()}})}rec.stop();await done;stream.getTracks().forEach(t=>t.stop());return new Blob(chunks,{type:'video/webm'})}
async function toMp4(webm){setStatus('⚙️ Loading MP4 converter...',78);const {FFmpeg}=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');const {fetchFile,toBlobURL}=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js');const ff=new FFmpeg();const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';await ff.load({coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')});await ff.writeFile('input.webm',await fetchFile(webm));await ff.exec(['-i','input.webm','-c:v','libx264','-pix_fmt','yuv420p','-movflags','+faststart','output.mp4']);const data=await ff.readFile('output.mp4');return new Blob([data.buffer],{type:'video/mp4'})}
async function renderVideo(){if(!script.value.trim())return alert('Create a script first.');if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)return alert('Use Chrome or Edge for browser rendering.');$('#render').disabled=true;try{const webm=await recordVideo();const mp4=await toMp4(webm);const url=URL.createObjectURL(mp4);preview.src=url;preview.style.display='block';download.href=url;download.download='ai-shorts-'+Date.now()+'.mp4';download.textContent='⬇️ Download MP4';download.style.display='block';setStatus('✅ MP4 ready!',100)}catch(e){console.error(e);setStatus('❌ MP4 conversion failed: '+e.message,0)}finally{$('#render').disabled=false}}
$('#render').onclick=renderVideo;
</script></body></html>
