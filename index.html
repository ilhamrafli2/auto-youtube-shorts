<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Shorts Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 16px 50px}.hero{text-align:center;padding:18px 0}.badge{color:#aab2c0;border:1px solid #30343d;border-radius:999px;padding:7px 12px;font-size:12px}.hero h1{font-size:clamp(30px,9vw,48px);line-height:1;margin:18px 0 10px}.hero p,.hint{color:#9299a5}.card{background:#101217;border:1px solid #252a33;border-radius:20px;padding:18px;margin-top:14px}.label{font-size:13px;color:#b9bec8;display:block;margin:0 0 8px}input,textarea,select{width:100%;background:#090b0f;border:1px solid #2a2f38;border-radius:13px;color:#fff;padding:14px;font:inherit}textarea{min-height:250px;resize:vertical}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}.btn{border:1px solid #303540;border-radius:12px;padding:13px;font:inherit;font-weight:750;background:#1a1d23;color:#fff;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.primary{background:#fff;color:#090a0d}.heroBtn{width:100%;margin-top:12px;font-size:17px;padding:16px}.btn:disabled{opacity:.5;cursor:wait}.status{margin-top:14px;padding:14px;border:1px solid #252a33;border-radius:13px;background:#0b0e13}.bar{height:9px;background:#252a33;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#fff;transition:.15s}.video,.live{width:100%;max-width:360px;display:block;margin:18px auto 0;border-radius:16px;background:#000;aspect-ratio:9/16}.download{display:block;margin-top:10px;text-align:center;background:#fff;color:#000;text-decoration:none;padding:13px;border-radius:12px;font-weight:800}.hint{font-size:12px;line-height:1.5}.ok{color:#a9f0bd}.diag{font-size:11px;color:#8d96a5;white-space:pre-wrap;margin-top:10px}
</style></head>
<body><main class="wrap">
<section class="hero"><span class="badge">CHATGPT → SUPERTONIC 3 → FFMPEG → MP4</span><h1>Idea → Video</h1><p>Satu tombol untuk script, voice Indonesia, dan MP4 lengkap dengan audio.</p></section>
<section class="card">
<label class="label">🎯 Topik video</label><input id="topic" placeholder="Contoh: Kenapa komputer makin lambat?">
<div class="row"><select id="language"><option>Bahasa Indonesia</option><option>English</option></select><button id="scriptBtn" class="btn">🧠 Script Saja</button></div>
<button id="all" class="btn primary heroBtn">🚀 GENERATE SEMUA — SCRIPT + VOICE + VIDEO</button>
<label class="label" style="margin-top:18px">📝 Script + scene plan</label><textarea id="script" placeholder="Klik Generate Semua..."></textarea>
<div class="row"><button id="regen" class="btn">🔄 Generate Ulang</button><button id="copy" class="btn">📋 Copy</button></div>
<div class="row"><button id="voice" class="btn">🔊 Voice</button><button id="render" class="btn">🎬 Render MP4</button></div>
<div id="status" class="status" style="display:none"><b id="statusText">Preparing...</b><div class="bar"><div id="fill" class="fill"></div></div><div id="diag" class="diag"></div></div>
<audio id="audio" controls style="width:100%;margin-top:14px;display:none"></audio><canvas id="live" class="live" width="360" height="640" style="display:none"></canvas><video id="preview" class="video" controls playsinline style="display:none"></video><a id="download" class="download" style="display:none"></a>
<p class="hint"><span class="ok">✓</span> Engine berat TIDAK dimuat saat halaman dibuka. TTS dan FFmpeg baru dimuat setelah tombol ditekan.</p>
</section></main>
<script type="module">
const $=s=>document.querySelector(s),topic=$('#topic'),script=$('#script'),language=$('#language'),status=$('#status'),statusText=$('#statusText'),fill=$('#fill'),diag=$('#diag'),audio=$('#audio'),live=$('#live'),preview=$('#preview'),download=$('#download'),all=$('#all');
let tts=null,style=null,lastWav=null,voiceDuration=0,ttsLoading=null,ffmpeg=null,ffmpegLoading=null;
function setStatus(t,p){status.style.display='block';statusText.textContent=t;fill.style.width=Math.max(0,Math.min(100,p))+'%'}function setDiag(t){diag.textContent=t}
async function makeScript(){if(!topic.value.trim())throw Error('Isi topik dulu.');$('#scriptBtn').disabled=true;setStatus('🧠 Membuat script...',8);try{const r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:language.value,duration:60})}),d=await r.json();if(!r.ok)throw Error(d.error||'Script generation failed');script.value=d.script;lastWav=null;voiceDuration=0;audio.style.display='none';return d.script}finally{$('#scriptBtn').disabled=false}}
$('#scriptBtn').onclick=async()=>{try{await makeScript();setStatus('✅ Script siap.',25)}catch(e){setStatus('❌ '+e.message,0);setDiag(e.stack||e.message)}};$('#regen').onclick=$('#scriptBtn').onclick;
$('#copy').onclick=async()=>{if(!script.value.trim())return alert('Script masih kosong.');await navigator.clipboard.writeText(script.value);setStatus('✅ Copied.',100)};
function narration(){const t=script.value,p=[...t.matchAll(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL\s*[:\-]|TIMING\s*[:\-]|SCENE\s*\d+|$)/gi)].map(m=>m[1].trim());return(p.length?p.join(' '):t.replace(/SCENE\s*\d+/gi,' ').replace(/VISUAL\s*[:\-][\s\S]*?(?=NARRATION|TIMING|$)/gi,' ').replace(/NARRATION\s*[:\-]/gi,' ').replace(/TIMING\s*[:\-][^\n]*/gi,' ')).replace(/\s+/g,' ').trim()}
function scenes(t){const b=t.split(/(?=SCENE\s*\d+)/i).filter(x=>x.trim());return(b.length?b:[t]).slice(0,10).map((x,i)=>({n:((x.match(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/i)||[])[1]||'').trim(),v:((x.match(/VISUAL\s*[:\-]\s*([\s\S]*?)(?=NARRATION|TIMING|SCENE\s*\d+|$)/i)||[])[1]||'').trim(),i}))}
async function initTTS(){if(tts&&style)return{tts,style};if(ttsLoading)return ttsLoading;ttsLoading=(async()=>{setStatus('⬇️ Memuat voice engine — ini baru dimulai sekarang...',28);setDiag('iPhone/WebGPU: '+(!!navigator.gpu)+'\ncrossOriginIsolated: '+crossOriginIsolated);const m=await import('./supertonic.js');const x=await m.loadTextToSpeech('https://huggingface.co/payam1394/traxlate-supertonic-3-q8ve/resolve/main/onnx',{},(n,c,t)=>{setStatus('⬇️ '+n+' '+c+'/'+t+'...',28+Math.min(35,(c/Math.max(1,t))*35))});tts=x.textToSpeech;style=await m.loadVoiceStyle(['https://huggingface.co/Supertone/supertonic-3/resolve/main/voice_styles/F1.json']);return{tts,style}})().catch(e=>{ttsLoading=null;throw e});return ttsLoading}
async function generateVoice(){if(!script.value.trim())throw Error('Buat script dulu.');$('#voice').disabled=true;try{const x=await initTTS();setStatus('🗣️ Generate voice Bahasa Indonesia...',65);const out=await x.tts.call(narration(),'id',x.style,8,1.05,.3,(s,t)=>setStatus('🗣️ Synthesizing '+s+'/'+t+'...',65+(s/t)*15));lastWav=new Blob([mWriteWav(out.wav,x.tts.sampleRate)],{type:'audio/wav'});voiceDuration=Number(out.duration[0])||0;audio.src=URL.createObjectURL(lastWav);audio.style.display='block';return lastWav}finally{$('#voice').disabled=false}}
function mWriteWav(wav,sr){const n=wav.length,ch=1,bps=2,buf=new ArrayBuffer(44+n*bps),v=new DataView(buf),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+n*bps,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*bps,true);v.setUint16(32,bps,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*bps,true);for(let i=0;i<n;i++)v.setInt16(44+i*bps,Math.max(-1,Math.min(1,wav[i]))*32767,true);return buf}
$('#voice').onclick=async()=>{try{await generateVoice();setStatus('✅ Voice siap — '+voiceDuration.toFixed(1)+' detik.',100)}catch(e){setStatus('❌ TTS gagal: '+e.message,0);setDiag(e.stack||e.message)}};
function wrap(c,text,x,y,w,h,max){const a=String(text||'').replace(/\s+/g,' ').trim().split(' '),ls=[];let line='';for(const word of a){const z=line?line+' '+word:word;if(c.measureText(z).width>w&&line){ls.push(line);line=word;if(ls.length>=max)break}else line=z}if(line&&ls.length<max)ls.push(line);const top=y-(ls.length-1)*h/2;ls.forEach((l,i)=>c.fillText(l,x,top+i*h))}
function drawScene(ctx,s,idx,total){ctx.fillStyle='#07080b';ctx.fillRect(0,0,360,640);const g=ctx.createLinearGradient(0,0,360,640);g.addColorStop(0,'#171b2a');g.addColorStop(1,'#05060a');ctx.fillStyle=g;ctx.fillRect(0,0,360,640);ctx.fillStyle='#fff';ctx.font='800 22px system-ui';ctx.textAlign='center';wrap(ctx,s.v||('Scene '+(idx+1)),180,290,300,31,7);ctx.fillStyle='#aeb5c1';ctx.font='500 15px system-ui';ctx.fillText((idx+1)+' / '+total,180,590)}
async function initFFmpeg(){
 if(ffmpeg)return ffmpeg;
 if(ffmpegLoading)return ffmpegLoading;
 ffmpegLoading=(async()=>{
  setStatus('⚙️ Memuat FFmpeg encoder...',78);
  setDiag('FFmpeg single-thread 0.12.10\niPhone/WebGPU: '+(!!navigator.gpu)+'\ncrossOriginIsolated: '+crossOriginIsolated+'\nMengunduh encoder ~32 MB...');
  const fmod=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js');
  const umod=await import('https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js');
  const f=new fmod.FFmpeg();
  f.on('log',({message})=>{console.log('[FFmpeg]',message);if(/error|failed|invalid|unknown|abort/i.test(message))setDiag('FFmpeg: '+message)});
  const base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd';
  const loadPromise=f.load({
   coreURL:await umod.toBlobURL(base+'/ffmpeg-core.js','text/javascript'),
   wasmURL:await umod.toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')
  });
  let timer;
  const timeout=new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('FFmpeg load timeout setelah 60 detik. Coba tekan Render MP4 lagi.')),60000)});
  try{await Promise.race([loadPromise,timeout]);}finally{clearTimeout(timer)}
  ffmpeg=f;
  setStatus('✅ FFmpeg siap — mulai membuat frame...',81);
  setDiag('FFmpeg 0.12.10 siap.\nMode: single-thread\nEncoder: H.264 → AAC');
  return{f,fetchFile:umod.fetchFile}
 })().catch(e=>{ffmpegLoading=null;throw e});
 return ffmpegLoading
}
async function renderMP4(){
 if(!script.value.trim())throw Error('Buat script dulu.');
 if(!lastWav)await generateVoice();
 if(!voiceDuration)throw Error('Durasi voice tidak terbaca.');
 const ss=scenes(script.value),pack=await initFFmpeg(),f=pack.f,fetchFile=pack.fetchFile,ctx=live.getContext('2d',{alpha:false});
 live.style.display='block';preview.style.display='none';download.style.display='none';
 const weights=ss.map(s=>Math.max(1,s.n.length||1)),sum=weights.reduce((a,b)=>a+b,0),durations=weights.map(w=>voiceDuration*w/sum),files=[];
 for(let i=0;i<ss.length;i++){
  drawScene(ctx,ss[i],i,ss.length);
  const blob=await new Promise((res,rej)=>live.toBlob(b=>b?res(b):rej(Error('Canvas JPEG gagal')),'image/jpeg',.82));
  const name='scene'+String(i).padStart(2,'0')+'.jpg';
  await f.writeFile(name,await fetchFile(blob));files.push({name,d:durations[i]});
  setStatus('🖼️ Scene '+(i+1)+'/'+ss.length+' siap...',82+(i/ss.length)*8)
 }
 let concat='';for(const x of files)concat+='file '+x.name+'\nduration '+x.d.toFixed(3)+'\n';concat+='file '+files[files.length-1].name+'\n';
 await f.writeFile('concat.txt',new TextEncoder().encode(concat));
 await f.writeFile('audio.wav',await fetchFile(lastWav));
 setStatus('🎬 Encoding MP4...',92);
 const common=['-f','concat','-safe','0','-i','concat.txt','-i','audio.wav','-map','0:v:0','-map','1:a:0','-vf','format=yuv420p','-r','24','-c:a','aac','-b:a','96k','-shortest','-movflags','+faststart'];
 let ok=false,err=null;
 for(const codec of [['libx264','-preset','ultrafast','-crf','30'],['mpeg4','-q:v','8']]){
  try{
   try{await f.deleteFile('output.mp4')}catch{}
   const rc=await f.exec([...common,'-c:v',...codec,'output.mp4'],180000);
   if(rc!==0)throw Error('FFmpeg exit code '+rc);
   ok=true;break
  }catch(e){err=e;console.warn('Codec failed',codec,e)}
 }
 if(!ok)throw Error('Encoder MP4 gagal: '+(err?.message||err));
 const data=await f.readFile('output.mp4');
 const bytes=data instanceof Uint8Array?data:data.data||data;
 const blob=new Blob([bytes],{type:'video/mp4'});
 if(!blob.size)throw Error('Video kosong');
 const url=URL.createObjectURL(blob);preview.src=url;preview.style.display='block';live.style.display='none';
 download.href=url;download.download='ai-shorts-'+Date.now()+'.mp4';download.textContent='⬇️ DOWNLOAD VIDEO MP4 + VOICE';download.style.display='block';
 setStatus('✅ VIDEO LENGKAP SELESAI — '+(blob.size/1048576).toFixed(1)+' MB',100);return blob
}
$('#render').onclick=async()=>{const b=$('#render');b.disabled=true;try{await renderMP4()}catch(e){setStatus('❌ Render gagal: '+e.message,0);setDiag(e.stack||e.message)}finally{b.disabled=false}};
async function generateAll(){if(!topic.value.trim())return alert('Isi topik dulu.');all.disabled=true;try{setStatus('🚀 1/3 Membuat script...',5);await makeScript();setStatus('🗣️ 2/3 Membuat voice...',45);await generateVoice();setStatus('🎬 3/3 Membuat VIDEO...',80);await renderMP4()}catch(e){setStatus('❌ Gagal: '+e.message,0);setDiag(e.stack||e.message)}finally{all.disabled=false}}
all.onclick=generateAll;
</script></body></html>
