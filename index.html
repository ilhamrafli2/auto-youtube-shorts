<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Generator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08090c;color:#f5f5f5;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:50px 20px}.hero{text-align:center;margin-bottom:30px}.badge{display:inline-block;border:1px solid #292c33;border-radius:999px;padding:7px 12px;color:#aeb4c0;font-size:13px}.hero h1{font-size:46px;line-height:1.05;margin:18px 0 12px;letter-spacing:-2px}.hero p{color:#969da9;font-size:17px}.card{background:#101217;border:1px solid #242832;border-radius:22px;padding:22px;box-shadow:0 20px 70px #0008}.label{font-size:14px;color:#b9bec8;margin-bottom:10px;display:block}textarea{width:100%;min-height:180px;resize:vertical;background:#0a0c10;border:1px solid #292e38;border-radius:15px;color:#fff;padding:17px;font:inherit;outline:none}textarea:focus{border-color:#6d7280}.row{display:flex;gap:12px;margin-top:14px}select,button,.download{border-radius:12px;padding:13px 16px;font:inherit;border:1px solid #2b303a;background:#171a20;color:#fff}select{flex:1}button{background:#fff;color:#090a0d;font-weight:700;cursor:pointer;flex:1}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:18px;padding:16px;border-radius:14px;background:#0b0e13;color:#b9c0cb;display:none}.statusTop{display:flex;justify-content:space-between;align-items:center;gap:12px}.statusText{font-size:16px}.percent{font-size:22px;font-weight:800;color:#fff;min-width:54px;text-align:right}.bar{height:10px;background:#252a33;border-radius:999px;overflow:hidden;margin-top:12px}.barFill{height:100%;width:0%;background:#fff;border-radius:999px;transition:width .7s ease}.stage{font-size:12px;color:#858d9a;margin-top:9px}.result{margin-top:18px;display:none}.result video{width:100%;border-radius:15px;background:#000}.download{display:block;text-align:center;text-decoration:none;background:#fff;color:#090a0d;font-weight:700;margin-top:12px}.small{color:#707783;font-size:12px;text-align:center;margin-top:18px}</style></head><body><main class="wrap"><section class="hero"><span class="badge">AI VIDEO STUDIO</span><h1>AI Video Generator</h1><p>Generate video → tunggu proses selesai → preview → download MP4.</p></section><section class="card"><label class="label">Prompt video (kosong = otomatis CPU 50 detik)</label><textarea id="prompt" placeholder="Kosongkan untuk video CPU processor marah 50 detik..."></textarea><div class="row"><select id="duration"><option value="50" selected>50 detik</option><option value="30">30 detik</option><option value="60">60 detik</option><option value="90">90 detik</option></select><button id="go">✨ Generate Video</button></div><div id="status" class="status"><div class="statusTop"><div class="statusText" id="statusText">⏳ Preparing...</div><div class="percent" id="percent">0%</div></div><div class="bar"><div class="barFill" id="barFill"></div></div><div class="stage" id="stage">Menunggu proses render...</div></div><div id="result" class="result"><video id="video" controls playsinline></video><a id="download" class="download" target="_blank" rel="noopener">⬇️ Download MP4</a></div></section><div class="small">Vercel frontend • Agnes backend • API key tidak disimpan di browser</div></main><script>const go=document.querySelector('#go'),p=document.querySelector('#prompt'),s=document.querySelector('#status'),st=document.querySelector('#statusText'),pc=document.querySelector('#percent'),bf=document.querySelector('#barFill'),stage=document.querySelector('#stage'),r=document.querySelector('#result'),v=document.querySelector('#video'),dl=document.querySelector('#download'),wait=ms=>new Promise(x=>setTimeout(x,ms));function setProgress(n,label){n=Math.max(0,Math.min(100,Math.round(n)));pc.textContent=n+'%';bf.style.width=n+'%';if(label)stage.textContent=label}go.onclick=async()=>{const prompt=p.value.trim(),duration=Number(document.querySelector('#duration').value);go.disabled=true;r.style.display='none';s.style.display='block';st.textContent='⏳ Membuat task Agnes...';setProgress(1,'Task dibuat — menyiapkan render...');try{const url='/api/generate?duration='+duration+(prompt?'&prompt='+encodeURIComponent(prompt):'');const a=await fetch(url);const d=await a.json();if(!a.ok)throw Error(d.error||'Gagal membuat task');st.textContent='⏳ Generating video...';let lastProgress=1;for(let i=0;i<120;i++){await wait(5000);const q=await fetch('/api/status?id='+encodeURIComponent(d.taskId));const x=await q.json();if(!q.ok)throw Error(x.error||'Gagal cek status');let progress=Number.isFinite(Number(x.progress))?Number(x.progress):null;if(progress!==null&&progress>lastProgress){lastProgress=Math.min(99,progress);setProgress(lastProgress,'Progress render Agnes');}else if(!x.done){const estimated=Math.min(95,Math.max(lastProgress,Math.round(1+((i+1)/120)*94)));lastProgress=estimated;setProgress(estimated,'Render sedang berjalan...');}st.textContent='⏳ Generating video...';if(x.failed)throw Error(x.details?.error||'Proses Agnes gagal');if(x.done){setProgress(100,'Video siap — render selesai');v.src=x.videoUrl;dl.href=x.videoUrl;v.load();r.style.display='block';st.textContent='✅ Video selesai!';break}if(i===119)throw Error('Timeout menunggu video.');}}catch(e){st.textContent='❌ '+e.message}finally{go.disabled=false}};</script></body></html>
