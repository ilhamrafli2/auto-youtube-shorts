<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Shorts Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:820px;margin:auto;padding:22px 16px 50px}.hero{text-align:center;padding:18px 0}.badge{color:#aab2c0;border:1px solid #30343d;border-radius:999px;padding:7px 12px;font-size:12px}.hero h1{font-size:clamp(30px,9vw,48px);line-height:1;margin:18px 0 10px}.hero p,.hint{color:#9299a5}.card{background:#101217;border:1px solid #252a33;border-radius:20px;padding:18px;margin-top:14px}.label{font-size:13px;color:#b9bec8;display:block;margin:0 0 8px}input,textarea,select{width:100%;background:#090b0f;border:1px solid #2a2f38;border-radius:13px;color:#fff;padding:14px;font:inherit}textarea{min-height:250px;resize:vertical}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}.btn{border:1px solid #303540;border-radius:12px;padding:13px;font:inherit;font-weight:750;background:#1a1d23;color:#fff;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.primary{background:#fff;color:#090a0d}.heroBtn{width:100%;margin-top:12px;font-size:17px;padding:16px}.btn:disabled{opacity:.5;cursor:wait}.status{margin-top:14px;padding:14px;border:1px solid #252a33;border-radius:13px;background:#0b0e13}.bar{height:9px;background:#252a33;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#fff;transition:.15s}.video,.live{width:100%;max-width:360px;display:block;margin:18px auto 0;border-radius:16px;background:#000;aspect-ratio:9/16}.download{display:block;margin-top:10px;text-align:center;background:#fff;color:#000;text-decoration:none;padding:13px;border-radius:12px;font-weight:800}.hint{font-size:12px;line-height:1.5}.ok{color:#a9f0bd}.diag{font-size:11px;color:#8d96a5;white-space:pre-wrap;margin-top:10px}
</style></head>
<body><main class="wrap">
<section class="hero"><span class="badge">CHATGPT → SUPERTONIC 3 → NATIVE VIDEO → MP4</span><h1>Idea → Video</h1><p>Satu tombol untuk script, voice Indonesia, dan video lengkap dengan audio.</p></section>
<section class="card">
<label class="label">🎯 Topik video</label><input id="topic" placeholder="Contoh: Kenapa komputer makin lambat?">
<div class="row"><select id="language"><option>Bahasa Indonesia</option><option>English</option></select><button id="scriptBtn" class="btn">🧠 Script Saja</button></div>
<button id="all" class="btn primary heroBtn">🚀 GENERATE SEMUA — SCRIPT + VOICE + VIDEO</button>
<label class="label" style="margin-top:18px">📝 Script + scene plan</label><textarea id="script" placeholder="Klik Generate Semua..."></textarea>
<div class="row"><button id="regen" class="btn">🔄 Generate Ulang</button><button id="copy" class="btn">📋 Copy</button></div>
<div class="row"><button id="voice" class="btn">🔊 Voice</button><button id="render" class="btn">🎬 BUAT VIDEO</button></div>
<div id="status" class="status" style="display:none"><b id="statusText">Preparing...</b><div class="bar"><div id="fill" class="fill"></div></div><div id="diag" class="diag"></div></div>
<audio id="audio" controls style="width:100%;margin-top:14px;display:none"></audio><canvas id="live" class="live" width="360" height="640" style="display:none"></canvas><video id="preview" class="video" controls playsinline webkit-playsinline style="display:none"></video><a id="download" class="download" style="display:none"></a>
<p class="hint"><span class="ok">✓</span> FFmpeg dimatikan untuk iPhone. Video direkam langsung dari Canvas + voice menggunakan MediaRecorder bawaan Safari.</p>
</section></main>
<script type="module">
const $=s=>document.querySelector(s),topic=$('#topic'),script=$('#script'),language=$('#language'),status=$('#status'),statusText=$('#statusText'),fill=$('#fill'),diag=$('#diag'),audio=$('#audio'),live=$('#live'),preview=$('#preview'),download=$('#download'),all=$('#all');
let tts=null,style=null,lastWav=null,voiceDuration=0,ttsLoading=null;
function setStatus(t,p){status.style.display='block';statusText.textContent=t;fill.style.width=Math.max(0,Math.min(100,p))+'%'}function setDiag(t){diag.textContent=t}
async function makeScript(){if(!topic.value.trim())throw Error('Isi topik dulu.');$('#scriptBtn').disabled=true;setStatus('🧠 Membuat script...',8);try{const r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:language.value,duration:60})}),d=await r.json();if(!r.ok)throw Error(d.error||'Script generation failed');script.value=d.script;lastWav=null;voiceDuration=0;audio.style.display='none';return d.script}finally{$('#scriptBtn').disabled=false}}
$('#scriptBtn').onclick=async()=>{try{await makeScript();setStatus('✅ Script siap.',25)}catch(e){setStatus('❌ '+e.message,0);setDiag(e.stack||e.message)}};$('#regen').onclick=$('#scriptBtn').onclick;
$('#copy').onclick=async()=>{if(!script.value.trim())return alert('Script masih kosong.');await navigator.clipboard.writeText(script.value);setStatus('✅ Copied.',100)};
function narration(){const t=script.value,p=[...t.matchAll(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL\s*[:\-]|TIMING\s*[:\-]|SCENE\s*\d+|$)/gi)].map(m=>m[1].trim());return(p.length?p.join(' '):t.replace(/SCENE\s*\d+/gi,' ').replace(/VISUAL\s*[:\-][\s\S]*?(?=NARRATION|TIMING|$)/gi,' ').replace(/NARRATION\s*[:\-]/gi,' ').replace(/TIMING\s*[:\-][^\n]*/gi,' ')).replace(/\s+/g,' ').trim()}
function scenes(t){const b=t.split(/(?=SCENE\s*\d+)/i).filter(x=>x.trim());return(b.length?b:[t]).slice(0,10).map((x,i)=>({n:((x.match(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/i)||[])[1]||'').trim(),v:((x.match(/VISUAL\s*[:\-]\s*([\s\S]*?)(?=NARRATION|TIMING|SCENE\s*\d+|$)/i)||[])[1]||'').trim(),i}))}
async function initTTS(){if(tts&&style)return{tts,style};if(ttsLoading)return ttsLoading;ttsLoading=(async()=>{setStatus('⬇️ Memuat voice engine...',28);setDiag('iPhone/WebGPU: '+(!!navigator.gpu)+'\nMediaRecorder: '+(!!window.MediaRecorder));const m=await import('./supertonic.js');const x=await m.loadTextToSpeech('https://huggingface.co/payam1394/traxlate-supertonic-3-q8ve/resolve/main/onnx',{},(n,c,t)=>setStatus('⬇️ '+n+' '+c+'/'+t+'...',28+Math.min(35,(c/Math.max(1,t))*35)));tts=x.textToSpeech;style=await m.loadVoiceStyle(['https://huggingface.co/Supertone/supertonic-3/resolve/main/voice_styles/F1.json']);return{tts,style}})().catch(e=>{ttsLoading=null;throw e});return ttsLoading}
async function generateVoice(){if(!script.value.trim())throw Error('Buat script dulu.');$('#voice').disabled=true;try{const x=await initTTS();setStatus('🗣️ Generate voice Bahasa Indonesia...',65);const out=await x.tts.call(narration(),'id',x.style,8,1.05,.3,(s,t)=>setStatus('🗣️ Synthesizing '+s+'/'+t+'...',65+(s/t)*15));lastWav=new Blob([mWriteWav(out.wav,x.tts.sampleRate)],{type:'audio/wav'});voiceDuration=Number(out.duration[0])||0;audio.src=URL.createObjectURL(lastWav);audio.style.display='block';return lastWav}finally{$('#voice').disabled=false}}
function mWriteWav(wav,sr){const n=wav.length,b=2,buf=new ArrayBuffer(44+n*b),v=new DataView(buf),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+n*b,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*b,true);v.setUint16(32,b,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*b,true);for(let i=0;i<n;i++)v.setInt16(44+i*b,Math.max(-1,Math.min(1,wav[i]))*32767,true);return buf}
$('#voice').onclick=async()=>{try{await generateVoice();setStatus('✅ Voice siap — '+voiceDuration.toFixed(1)+' detik.',100)}catch(e){setStatus('❌ TTS gagal: '+e.message,0);setDiag(e.stack||e.message)}};
function wrap(c,text,x,y,w,h,max){const a=String(text||'').replace(/\s+/g,' ').trim().split(' '),ls=[];let line='';for(const word of a){const z=line?line+' '+word:word;if(c.measureText(z).width>w&&line){ls.push(line);line=word;if(ls.length>=max)break}else line=z}if(line&&ls.length<max)ls.push(line);const top=y-(ls.length-1)*h/2;ls.forEach((l,i)=>c.fillText(l,x,top+i*h))}
function drawScene(ctx,s,idx,total,phase=0){ctx.clearRect(0,0,360,640);const g=ctx.createLinearGradient(0,0,360,640);g.addColorStop(0,'#171b2a');g.addColorStop(1,'#05060a');ctx.fillStyle=g;ctx.fillRect(0,0,360,640);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 22px system-ui';wrap(ctx,s.v||('Scene '+(idx+1)),180,285+Math.sin(phase)*7,300,31,7);ctx.fillStyle='#aeb5c1';ctx.font='500 15px system-ui';ctx.fillText((idx+1)+' / '+total,180,590);ctx.fillStyle='#fff';ctx.globalAlpha=.18;ctx.fillRect(35,70,290,3);ctx.globalAlpha=1}
function pickMime(){const a=['video/mp4;codecs="avc1.4D401E,mp4a.40.2"','video/mp4;codecs="avc1.4D401E"','video/mp4','video/webm;codecs="vp8,opus"','video/webm'];return a.find(x=>MediaRecorder.isTypeSupported(x))||''}
async function renderVideo(){
 if(!script.value.trim())throw Error('Buat script dulu.');
 if(!lastWav)await generateVoice();
 if(!voiceDuration)throw Error('Durasi voice tidak terbaca.');
 if(!window.MediaRecorder)throw Error('Browser tidak mendukung MediaRecorder.');
 const mime=pickMime();if(!mime)throw Error('Tidak ada format video yang didukung browser ini.');
 const ss=scenes(script.value),ctx=live.getContext('2d',{alpha:false});live.style.display='block';preview.style.display='none';download.style.display='none';
 const weights=ss.map(s=>Math.max(1,s.n.length||1)),sum=weights.reduce((a,b)=>a+b,0),durations=weights.map(w=>voiceDuration*w/sum);
 const canvasStream=live.captureStream(24);if(!canvasStream.getVideoTracks().length)throw Error('Canvas video track tidak tersedia di iPhone.');
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('AudioContext tidak tersedia.');
 const ac=new AC();if(ac.state==='suspended')await ac.resume();
 const decoded=await ac.decodeAudioData(await lastWav.arrayBuffer());const dest=ac.createMediaStreamDestination();const src=ac.createBufferSource();src.buffer=decoded;src.connect(dest);
 const stream=new MediaStream([...canvasStream.getVideoTracks(),...dest.stream.getAudioTracks()]);
 let chunks=[];let recorder;
 try{recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1600000,audioBitsPerSecond:96000})}catch(e){await ac.close();throw Error('MediaRecorder gagal: '+e.message)}
 setDiag('Native recorder OK\nFormat: '+mime+'\nCanvas: 360×640 / 24fps\nAudio: voice → stream\nFFmpeg: TIDAK DIPAKAI');
 recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 const stopped=new Promise((resolve,reject)=>{recorder.onerror=e=>reject(e.error||Error('Recorder error'));recorder.onstop=resolve});
 drawScene(ctx,ss[0],0,ss.length,0);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 recorder.start(500);src.start(0);const start=performance.now();let elapsed=0,idx=0;
 while(elapsed<voiceDuration){elapsed=Math.min(voiceDuration,(performance.now()-start)/1000);let acc=0;idx=0;for(let i=0;i<durations.length;i++){if(elapsed>=acc+durations[i]&&i<durations.length-1){acc+=durations[i];idx=i+1}else break}drawScene(ctx,ss[idx],idx,ss.length,(elapsed-acc)*2);setStatus('🎥 Merekam video '+elapsed.toFixed(0)+' / '+Math.ceil(voiceDuration)+' detik...',80+(elapsed/voiceDuration)*18);await new Promise(r=>setTimeout(r,30))}
 setStatus('⏳ Finalisasi video...',99);recorder.stop();try{src.stop()}catch{}await stopped;stream.getTracks().forEach(t=>t.stop());await ac.close();
 const type=recorder.mimeType||mime,blob=new Blob(chunks,{type});if(blob.size<10000)throw Error('File video kosong. Bytes: '+blob.size);
 const url=URL.createObjectURL(blob);preview.src=url;preview.style.display='block';live.style.display='none';download.href=url;download.download='ai-shorts-'+Date.now()+(type.includes('mp4')?'.mp4':'.webm');download.textContent=type.includes('mp4')?'⬇️ DOWNLOAD MP4 + VOICE':'⬇️ DOWNLOAD VIDEO + VOICE';download.style.display='block';setStatus('✅ VIDEO SELESAI — '+(blob.size/1048576).toFixed(1)+' MB',100);setDiag('Berhasil dibuat langsung di iPhone.\n'+type+'\nAudio + video tergabung.');return blob
}
$('#render').onclick=async()=>{const b=$('#render');b.disabled=true;try{await renderVideo()}catch(e){setStatus('❌ Render gagal: '+e.message,0);setDiag((e.stack||e.message)+'\n\nTekan BUAT VIDEO sekali lagi bila perlu.')}finally{b.disabled=false}};
async function generateAll(){if(!topic.value.trim())return alert('Isi topik dulu.');all.disabled=true;try{setStatus('🚀 1/3 Membuat script...',5);await makeScript();setStatus('🗣️ 2/3 Membuat voice...',45);await generateVoice();setStatus('🎬 3/3 Membuat VIDEO...',80);await renderVideo()}catch(e){setStatus('❌ Gagal: '+e.message,0);setDiag(e.stack||e.message)}finally{all.disabled=false}}
all.onclick=generateAll;
</script></body></html>
