<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Generator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#08090c;color:#f5f5f5;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:70px 20px}.badge{display:inline-block;border:1px solid #292c33;border-radius:999px;padding:7px 12px;color:#aeb4c0;font-size:13px}.hero{text-align:center;margin-bottom:38px}.hero h1{font-size:52px;line-height:1.05;margin:18px 0 12px;letter-spacing:-2px}.hero p{color:#969da9;font-size:17px}.card{background:#101217;border:1px solid #242832;border-radius:22px;padding:22px;box-shadow:0 20px 70px #0008}.label{font-size:14px;color:#b9bec8;margin-bottom:10px;display:block}textarea{width:100%;min-height:180px;resize:vertical;background:#0a0c10;border:1px solid #292e38;border-radius:15px;color:#fff;padding:17px;font:inherit;outline:none}textarea:focus{border-color:#6d7280}.row{display:flex;gap:12px;margin-top:14px}select,button{border-radius:12px;padding:13px 16px;font:inherit;border:1px solid #2b303a;background:#171a20;color:#fff}select{flex:1}button{background:#fff;color:#090a0d;font-weight:700;cursor:pointer;flex:1}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:18px;display:none;padding:14px;border-radius:12px;background:#0b0e13;color:#b9c0cb}.result{margin-top:18px;display:none}.result video{width:100%;border-radius:15px}.small{color:#707783;font-size:12px;text-align:center;margin-top:18px}
</style></head>
<body><main class="wrap"><section class="hero"><span class="badge">AI VIDEO STUDIO</span><h1>Turn your idea into a video.</h1><p>Tulis cerita atau prompt. AI akan menyiapkan video lengkap dari konsep sampai suara dan subtitle.</p></section>
<section class="card"><label class="label">Apa yang ingin kamu buat?</label><textarea id="prompt" placeholder="Contoh: Buat video pendek cinematic tentang perjalanan seorang anak menemukan kota futuristik di tahun 2050..."></textarea><div class="row"><select id="duration"><option value="30">30 detik</option><option value="60" selected>60 detik</option><option value="90">90 detik</option></select><button id="go">✨ Generate Video</button></div><div id="status" class="status"></div><div id="result" class="result"><video id="video" controls></video></div></section><div class="small">Simple mode • Vercel-ready • API key tidak disimpan di browser</div></main>
<script>
const go=document.querySelector('#go'),promptEl=document.querySelector('#prompt'),statusEl=document.querySelector('#status'),result=document.querySelector('#result'),video=document.querySelector('#video');
go.onclick=async()=>{const prompt=promptEl.value.trim();if(!prompt)return alert('Tulis prompt dulu.');go.disabled=true;statusEl.style.display='block';statusEl.textContent='⏳ Menyiapkan video...';result.style.display='none';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,duration:Number(document.querySelector('#duration').value)})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Gagal membuat video');if(d.videoUrl){video.src=d.videoUrl;result.style.display='block';statusEl.textContent='✅ Video selesai!'}else{statusEl.textContent='✅ Request diterima. '+(d.message||'Generator sedang memproses video.')}}catch(e){statusEl.textContent='❌ '+e.message}finally{go.disabled=false}};
</script></body></html>
