<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT → HeyGen Video Studio</title><style>body{margin:0;background:#07080b;color:#fff;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.hero{text-align:center;padding:20px 0}.badge{color:#aab2c0;border:1px solid #30343d;border-radius:999px;padding:7px 12px;font-size:12px}.hero h1{font-size:clamp(32px,9vw,48px);line-height:1;margin:18px 0 10px}.hero p{color:#9299a5}.card{background:#101217;border:1px solid #252a33;border-radius:20px;padding:18px;margin-top:14px}.label{font-size:13px;color:#b9bec8;display:block;margin:0 0 8px}input,textarea,select{width:100%;box-sizing:border-box;background:#090b0f;border:1px solid #2a2f38;border-radius:13px;color:#fff;padding:14px;font:inherit}textarea{min-height:220px;resize:vertical}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}.btn{border:1px solid #303540;border-radius:12px;padding:13px;font:inherit;font-weight:750;background:#1a1d23;color:#fff}.primary{background:#fff;color:#090a0d}.btn:disabled{opacity:.5}.status{margin-top:14px;padding:14px;border:1px solid #252a33;border-radius:13px;background:#0b0e13}.bar{height:9px;background:#252a33;border-radius:9px;overflow:hidden;margin-top:10px}.fill{height:100%;width:0;background:#fff;transition:.4s}.result{margin-top:14px}.result video{width:100%;border-radius:14px;background:#000}.download{display:block;margin-top:10px;text-align:center;background:#fff;color:#000;text-decoration:none;padding:13px;border-radius:12px;font-weight:800}.hint{font-size:12px;color:#737b88}</style></head><body><main class="wrap"><section class="hero"><span class="badge">CHATGPT → HEYGEN</span><h1>Idea → Script → MP4</h1><p>ChatGPT membuat script, HeyGen merender video.</p></section><section class="card"><label class="label">🎯 Topik video</label><input id="topic" placeholder="Contoh: 5 AI tools yang benar-benar gratis"><div class="row"><button id="scriptBtn" class="btn">🧠 Buat Script ChatGPT</button><select id="language"><option>English</option><option>Bahasa Indonesia</option></select></div><label class="label" style="margin-top:14px">📝 Script</label><textarea id="script" placeholder="Generate script dulu, lalu boleh diedit di sini..."></textarea><div class="row"><button id="regen" class="btn">🔄 Generate Ulang</button><button id="videoBtn" class="btn primary">🎬 Buat Video HeyGen</button></div><div id="status" class="status" style="display:none"><b id="statusText">Menyiapkan...</b><div class="bar"><div id="fill" class="fill"></div></div></div><div id="result" class="result" style="display:none"><video id="video" controls playsinline></video><a id="download" class="download" target="_blank">⬇️ Download MP4</a></div><p class="hint">API key tidak disimpan di browser. Vercel memakai HEYGEN_API_KEY, HEYGEN_AVATAR_ID, HEYGEN_VOICE_ID sebagai environment variables.</p></section></main><script>const $=x=>document.querySelector(x),topic=$('#topic'),script=$('#script'),language=$('#language'),status=$('#status'),statusText=$('#statusText'),fill=$('#fill'),result=$('#result'),video=$('#video'),download=$('#download');async function makeScript(){if(!topic.value.trim())return alert('Isi topik dulu.');$('#scriptBtn').disabled=true;status.style.display='block';statusText.textContent='🧠 ChatGPT membuat script...';fill.style.width='15%';try{let r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:language.value,duration:60})}),d=await r.json();if(!r.ok)throw Error(d.error||'Gagal membuat script');script.value=d.script;fill.style.width='100%';statusText.textContent='✅ Script siap';}catch(e){statusText.textContent='❌ '+e.message}finally{$('#scriptBtn').disabled=false}}$('#scriptBtn').onclick=makeScript;$('#regen').onclick=makeScript;$('#videoBtn').onclick=async()=>{if(!script.value.trim())await makeScript();if(!script.value.trim())return;$('#videoBtn').disabled=true;status.style.display='block';result.style.display='none';statusText.textContent='🎬 Mengirim ke HeyGen...';fill.style.width='10%';try{let r=await fetch('/api/heygen',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({script:script.value})}),d=await r.json();if(!r.ok)throw Error(d.error||'Gagal membuat video');for(let i=0;i<180;i++){await new Promise(x=>setTimeout(x,5000));let q=await fetch('/api/heygen-status?id='+encodeURIComponent(d.videoId)+'&t='+Date.now()),x=await q.json();if(!q.ok)throw Error(x.error||'Gagal cek status');fill.style.width=Math.min(95,10+Math.round((i+1)/180*85))+'%';statusText.textContent='⏳ HeyGen: '+(x.status||'processing');if(x.failed)throw Error(x.error||'Render gagal');if(x.done&&x.videoUrl){fill.style.width='100%';statusText.textContent='✅ Video selesai!';video.src=x.videoUrl;download.href=x.videoUrl;result.style.display='block';break}}}catch(e){statusText.textContent='❌ '+e.message}finally{$('#videoBtn').disabled=false}};</script></body></html>
