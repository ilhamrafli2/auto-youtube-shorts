<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Shorts Factory</title><style>body{font-family:system-ui;background:#0b0b0f;color:#fff;margin:0;padding:20px}main{max-width:760px;margin:auto}input,button{width:100%;box-sizing:border-box;padding:14px;border-radius:12px;border:1px solid #333;background:#17171d;color:#fff;font-size:16px}button{background:#fff;color:#000;font-weight:700;margin-top:10px}button:disabled{opacity:.5}.card{background:#14141a;border:1px solid #292932;border-radius:18px;padding:18px;margin:12px 0}progress{width:100%;height:18px}video{width:100%;border-radius:16px;margin-top:12px}.small{color:#aaa;font-size:13px;white-space:pre-wrap}</style></head><body><main><h1>🎬 AI Shorts Factory</h1><div class="card"><b>1. Topik</b><input id="topic" value="5 fakta AI yang bikin kamu kaget"><button id="go">🚀 Generate Short</button></div><div class="card"><b>Status</b><p id="status">Siap.</p><progress id="bar" value="0" max="100"></progress><p class="small" id="script"></p><video id="preview" controls playsinline hidden></video><a id="download" style="display:none" download="FINAL_SHORTS.mp4"><button>⬇️ Download FINAL_SHORTS.mp4</button></a></div></main><script type="module">
import {FFmpeg} from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm';import {fetchFile,toBlobURL} from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm';
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function post(url,body){let r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||'Request gagal');return j}
async function poll(name){for(let i=0;i<90;i++){let r=await fetch('/api/veo/status?name='+encodeURIComponent(name));let j=await r.json();if(j.error)throw Error(j.error);if(j.done&&j.uri)return j.uri;await sleep(5000)}throw Error('Veo terlalu lama.')}
$('go').onclick=async()=>{let btn=$('go');btn.disabled=true;$('preview').hidden=true;$('download').style.display='none';$('bar').value=2;try{
 $('status').textContent='🧠 Membuat script + 8 scene...';let plan=await post('/api/plan',{topic:$('topic').value});$('script').textContent=plan.script;$('bar').value=8;
 let blobs=[];for(let i=0;i<plan.scenes.length;i++){ $('status').textContent=`🎥 Veo scene ${i+1}/8...`;let op=await post('/api/veo/start',{prompt:plan.scenes[i].prompt});let uri=await poll(op.name);let r=await fetch('/api/veo/download?uri='+encodeURIComponent(uri));if(!r.ok)throw Error('Download scene '+(i+1)+' gagal');blobs.push(await r.blob());$('bar').value=10+Math.round((i+1)/8*55)}
 $('status').textContent='🧩 Menggabungkan 8 scene di HP...';let ff=new FFmpeg();let base='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';await ff.load({coreURL:await toBlobURL(base+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(base+'/ffmpeg-core.wasm','application/wasm')});let list='';for(let i=0;i<blobs.length;i++){let n=`s${i}.mp4`;await ff.writeFile(n,await fetchFile(blobs[i]));list+=`file '${n}'\n`}await ff.writeFile('list.txt',list);await ff.exec(['-f','concat','-safe','0','-i','list.txt','-vf','scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2','-c:v','libx264','-preset','veryfast','-c:a','aac','-movflags','+faststart','final.mp4']);let data=await ff.readFile('final.mp4');let url=URL.createObjectURL(new Blob([data.buffer],{type:'video/mp4'}));$('preview').src=url;$('preview').hidden=false;$('download').href=url;$('download').style.display='block';$('bar').value=100;$('status').textContent='✅ SELESAI — video siap di-download.';
 }catch(e){$('status').textContent='❌ '+e.message}finally{btn.disabled=false}}
</script></body></html>
