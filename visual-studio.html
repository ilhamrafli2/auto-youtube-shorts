]/gi,' ').replace(/\s+/g,' ').trim()}async function makeScript(){if(!topic.value.trim())throw Error('Isi topik dulu.');scriptBtn.disabled=true;stat('🧠 Membuat script + scene...',5);try{const r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:lang.value,duration:60})}),d=await r.json();if(!r.ok)throw Error(d.error||'Script gagal');script.value=d.script||'';clipsOut=[];clips.innerHTML='';wav=null;stat('✅ Script siap — '+scenes().length+' scene.',12)}finally{scriptBtn.disabled=false}}scriptBtn.onclick=async()=>{try{await makeScript()}catch(e){fail(e)}};function pcm(samples,sr){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+samples.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,samples[i]))*32767,true);return new Blob([b],{type:'audio/wav'})}async function makeVoice(){if(!script.value.trim())await makeScript();const text=narration();if(!text)throw Error('Narration kosong.');voiceBtn.disabled=true;const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),parts=text.match(/.{1,170}(?:\s|$)/g)||[text],buf=[];try{for(let i=0;i<parts.length;i++){stat('🗣️ Voice '+(i+1)+'/'+parts.length+'...',15+(i/parts.length)*25,'TTS server · iPhone-safe');const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:parts[i],lang:lang.value==='English'?'en':'id'})});if(!r.ok)throw Error('TTS HTTP '+r.status);buf.push(await ac.decodeAudioData(await r.arrayBuffer()))}const sr=buf[0].sampleRate,len=buf.reduce((n,b)=>n+b.length,0),out=ac.createBuffer(1,len,sr);let off=0;for(const b of buf){out.getChannelData(0).set(b.getChannelData(0),off);off+=b.length}wav=pcm(out.getChannelData(0),sr);audio.src=URL.createObjectURL(wav);audio.style.display='block';stat('✅ Voice siap — '+out.duration.toFixed(1)+' detik.',40,'WAV · iPhone-safe')}finally{await ac.close();voiceBtn.disabled=false}}voiceBtn.onclick=async()=>{try{await makeVoice()}catch(e){fail(e)}};function promptFor(s,i){return 'Cinematic real moving video footage. '+String(s.v||s.n||'').replace(/\s+/g,' ').trim()+'. Realistic physics, continuous natural motion, natural subject movement, detailed environment, dynamic camera movement, vertical 9:16 composition. No still image, no slideshow, no text, no subtitles, no logos. Scene '+(i+1)+' of a documentary about '+topic.value+'.'}async function submit(e,p){let data;if(e.type==='flash')data=[p,null,null,'768x1344 · 9:16 full',3,42,false];else if(e.type==='h3')data=[p,null,null,'768x1344 · 9:16 full',5,20,42,false];else if(e.type==='ltx')data=[p,'worst quality, inconsistent motion, blurry, jittery, distorted',null,null,512,704,'text-to-video',1.0,9,42,true,3,false];else data=[p,null,1280,704,73,25,5,-1];const r=await fetch(e.url+'/gradio_api/call/'+e.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});if(!r.ok){let b='';try{b=await r.text()}catch{}throw Error(e.name+' HTTP '+r.status+(b?' · '+b.slice(0,180):''))}const j=await r.json();if(!j.event_id)throw Error(e.name+' no event_id');return j.event_id}function extract(raw,e){let o;try{o=JSON.parse(raw)}catch{return null}if(Array.isArray(o))o=o[0];const u=o?.url||o?.video?.url||o?.video?.path||o?.path||o?.data?.url||o?.data?.path||(typeof o==='string'?o:'');return u?(/^https?:/i.test(u)?u:e.url+'/file='+u):null}async function stream(e,id){for(let k=0;k<48;k++){const r=await fetch(e.url+'/gradio_api/call/'+e.api+'/'+encodeURIComponent(id));if(r.ok){const lines=(await r.text()).split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.sl ,...dest.stream.getAudioTracks()]),mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('MediaRecorder tidak tersedia');const rec=new MediaRecorder(ms,{mimeType:mime,videoBitsPerSecond:2200000,audioBitsPerSecond:128000}),chunks=[];rec.ondataavailable=e=>e.data?.size&&chunks.push(e.data);const vids=[];for(const u of clipsOut){const v=document.createElement('video');v.src=u;v.crossOrigin='anonymous';v.muted=true;v.playsInline=true;v.preload='auto';await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(Error('Clip gagal dimuat'))});vids.push(v)}const ctx=canvas.getContext('2d'),started=performance.now(),total=ab.duration;rec.start(250);src.start();function draw(){const t=(performance.now()-started)/1000;if(t>=total){rec.stop();return}const v=vids[Math.floor(t/3)%vids.length],local=t%3;if(v.readyState>=2){if(Math.abs(v.currentTime-local)>.15)v.currentTime=local;const s=Math.max(360/v.videoWidth,640/v.videoHeight),w=v.videoWidth*s,h=v.videoHeight*s;ctx.fillStyle='#000';ctx.fillRect(0,0,360,640);ctx.drawImage(v,(360-w)/2,(640-h)/2,w,h)}requestAnimationFrame(draw)}vids.forEach(v=>v.play().catch(()=>{}));draw();await new Promise((ok,no)=>{rec.onstop=ok;rec.onerror=e=>no(e.error||Error('Recorder error'))});src.stop();ms.getTracks().forEach(t=>t.stop());await ac.close();const blob=new Blob(chunks,{type:(rec.mimeType||mime).split(';')[0]}),u=URL.createObjectURL(blob),ext=(rec.mimeType||mime).includes('mp4')?'mp4':'webm';preview.src=u;preview.style.display='block';download.href=u;download.download='ai-shorts-'+Date.now()+'.'+ext;download.textContent='⬇️ DOWNLOAD VIDEO ANIMASI '+ext.toUpperCase();download.style.display='block';stat('🎉 VIDEO ANIMASI SELESAI!',100,'REAL AI FOOTAGE · '+vids.length+' clips · voice + video')}generateBtn.onclick=async()=>{if(busy)return;busy=true;generateBtn.disabled=true;try{await makeScript();await makeVoice();await genClips();await r
