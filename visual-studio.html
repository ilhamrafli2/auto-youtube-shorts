tion></main><script>(()=>{const $=x=>document.getElementById(x),topic=$('topic'),lang=$('lang'),script=$('script'),status=$('status'),st=$('statusText'),fill=$('fill'),diag=$('diag'),errors=$('errors'),clips=$('clips'),audio=$('audio'),canvas=$('canvas'),preview=$('preview'),download=$('download'),sb=$('scriptBtn'),vb=$('voiceBtn'),fb=$('videoBtn'),gb=$('generateBtn');let wav=null,urls=[],busy=false;const sleep=m=>new Promise(r=>setTimeout(r,m));const engines=[{n:'FlashGen A',u:'https://hugging-apps-minimax-h3-flashgen-4step.hf.space',a:'generate',t:'flash'},{n:'FlashGen B',u:'https://innoai-minimax-h3-flashgen-4step.hf.space',a:'generate',t:'flash'},{n:'LTX Video',u:'https://lightricks-ltx-video-distilled.hf.space',a:'text_to_video',t:'ltx'},{n:'MiniMax H3',u:'https://multimodalart-minimax-h3.hf.space',a:'generate',t:'h3'},{n:'Wan A',u:'https://kpkp21-wan2-video-generation.hf.space',a:'generate_video',t:'wan'},{n:'Wan B',u:'https://openking-wan2-video-generation.hf.space',a:'generate_video',t:'wan'}];function stat(x,p,d=''){status.style.display='block';st.textContent=x;fill.style.width=Math.min(100,Math.max(0,p))+'%';diag.textContent=d}function err(x){stat('❌ '+(x.message||x),0,x.stack||'')}function add(x){errors.textContent+=(errors.textContent?'\n':'')+'• '+x}function getScenes(){let a=(script.value||'').split(/(?=SCENE\s*\d+)/i).filter(x=>x.trim());if(!a.length)a=[script.value];return a.slice(0,8).map((r,i)=>({i,v:(r.match(/VISUAL\s*[:\-]\s*([\s\S]*?)(?=NARRATION|TIMING|SCENE\s*\d+|$)/i)||[])[1]?.trim()||r,n:(r.match(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/i)||[])[1]?.trim()||''}))}function narr(){const a=[...script.value.matchAll(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/gi)].map(x=>x[1].trim()).filter(Boolean);return a.length?a.join(' '):script.value.replace(/SCENE\s*\d+/gi,' ').replace(/VISUAL\s*[:\-][\s\S]*?(?=NARRATION|TIMING|$)/gi,' ').replace(/TIMING\s*[:\-][^\n]*/gi,' ').replace(/NARRATION\s*[:\-]/gi,' ').replace(/\s+/g,' ').trim()}async function makeScript(){if(!topic.value.trim())throw Error('Isi topik dulu.');sb.disabled=true;stat('🧠 Membuat script...',5);try{const r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:lang.value,duration:60})});const d=await r.json();if(!r.ok)throw Error(d.error||'Script gagal');script.value=d.script||'';stat('✅ Script siap — '+getScenes().length+' scene.',10)}finally{sb.disabled=false}}sb.onclick=async()=>{try{await makeScript()}catch(e){err(e)}};function wavBlob(samples,sr){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));w(0,'RIFF');v.setUint32(4,36+samples.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,samples[i]))*32767,true);return new Blob([b],{type:'audio/wav'})}async function makeVoice(){if(!script.value.trim())await makeScript();const text=narr();if(!text)throw Error('Narration kosong.');vb.disabled=true;const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),parts=text.match(/.{1,170}(?:\s|$)/g)||[text],bs=[];try{for(let i=0;i<parts.length;i++){stat('🗣️ Voice '+(i+1)+'/'+parts.length,12+i/parts.length*25,'TTS server');const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:parts[i],lang:lang.value==='English'?'en':'id'})});if(!r.ok)throw Error('TTS HTTP '+r.status);bs.push(await ac.decodeAudioData(await r.arrayBuffer()))}const sr=bs[0].sampleRate,len=bs.reduce((n,b)=>n+b.length,0),out=ac.createBuffer(1,len,sr);let off=0;for(const b of bs){out.getChannelData(0).set(b.getChannelData(0),off);off+=b.length}wav=wavBlob(out.getChannelData(0),sr);audio.src=URL.createObjectURL(wav);audio.style.display='block';stat('✅ Voice siap — '+out.duration.toFixed(1)+' detik.',38,'iPhone-safe')}finally{await ac.close();vb.disabled=false}}vb.onclick=async()=>{try{await makeVoice()}catch(e){err(e)}};function pmt(s,i){return 'Realistic cinematic moving video. '+(s.v||s.n)+' Continuous natural motion, realistic physics, moving camera, detailed environment, vertical 9:16, no still image, no slideshow, no text, no logo. Scene '+(i+1)+' about '+topic.value+'.'}async function submit(e,p){let d;if(e.t==='flash')d=[p,null,null,'544x960 · 9:16 fast',2,42,false];else if(e.t==='h3')d=[p,null,null,'544x960 · 9:16 fast',3,12,42,false];else if(e.t==='ltx')d=[p,'worst quality, blurry, jittery, distorted',null,null,512,704,'text-to-video',1,9,42,true,3,false];else d=[p,null,1280,704,73,25,5,-1];const r=await fetch(e.u+'/gradio_api/call/'+e.a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:d})});if(!r.ok){let b='';try{b=await r.text()}catch{}throw Error(e.n+' HTTP '+r.status+(b?' · '+b.slice(0,180):''))}const j=await r.json();if(!j.event_id)throw Error(e.n+' no event_id');return j.event_id}function extract(x,e){try{let o=JSON.parse(x);if(Array.isArray(o))o=o[0];let u=o?.url||o?.video?.url||o?.video?.path||o?.path||o?.data?.url||o?.data?.path||(typeof o==='string'?o:'');return u?( /^https?:/i.test(u)?u:e.u+'/file='+u):null}catch{return null}}async function wait(e,id){for(let i=0;i<36;i++){const r=await fetch(e.u+'/gradio_api/call/'+e.a+'/'+encodeURIComponent(id));if(r.ok){const ls=(await r.text()).split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim()).filter(Boolean);for(const x of ls.reverse()){if(x==='[DONE]')continue;const u=extract(x,e);if(u)return u}throw Error(e.n+' returned no video URL')}if([429,502,503].includes(r.status)){await sleep(4000);continue}throw Error(e.n+' stream HTTP '+r.status)}throw Error(e.n+' GPU timeout')}async function one(p,i){let last;for(const e of engines){stat('🎬 '+e.n+' — scene '+(i+1),40,'Mengirim ke GPU · '+(e.t==='flash'?'544×960 FAST / 2 detik':e.t==='ltx'?'512×704 / 1 detik':'light mode'));try{const id=await submit(e,p);stat('⏳ '+e.n+' GPU aktif',43,'Queue diproses...');return await wait(e,id)}catch(x){last=x;add(x.message||String(x));stat('↪️ '+e.n+' dilewati',40,x.message||String(x));await sleep(700)}}throw last||Error('Semua engine gagal')}async function makeVideos(){if(!script.value.trim())await makeScript();fb.disabled=true;urls=[];clips.innerHTML='';errors.textContent='';try{const ss=getScenes();for(let i=0;i<ss.length;i++){const u=await one(pmt(ss[i],i),i);urls.push(u);const box=document.createElement('div');box.className='clip';const v=document.createElement('video');v.src=u;v.controls=true;v.playsInline=true;v.muted=true;box.appendChild(v);const sm=document.createElement('small');sm.textContent='Scene '+(i+1)+' · REAL AI VIDEO';box.appendChild(sm);clips.appendChild(box);stat('✅ Scene '+(i+1)+'/'+ss.length+' selesai',45+(i+1)/ss.length*45,'Video AI bergerak nyata')}}finally{fb.disabled=false}}fb.onclick=async()=>{try{await makeVideos()}catch(e){err(e)}};async function render(){if(!urls.length)await makeVideos();if(!wav)await makeVoice();const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();if(ac.state==='suspended')await ac.resume();const ab=await ac.decodeAudioData(await wav.arrayBuffer()),src=ac.createBufferSource(),dest=ac.createMediaStreamDestination();src.buffer=ab;src.connect(dest);const stream=canvas.captureStream(24);const ms=new MediaStream([...stream.getVideoTracks(),...dest.stream.getAudioTracks()]);const mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('MediaRecorder tidak tersedia');const rec=new MediaRecorder(ms,{mimeType:mime,videoBitsPerSecond:2200000,audioBitsPerSecond:128000}),chunks=[];rec.ondataavailable=e=>e.data?.size&&chunks.push(e.data);const vids=[];for(const u of urls){const v=document.createElement('video');v.src=u;v.crossOrigin='anonymous';v.muted=true;v.playsInline=true;await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(Error('Clip tidak bisa dimuat'))});vids.push(v)}const ctx=canvas.getContext('2d'),start=performance.now(),total=ab.duration;rec.start(250);src.start();vids.forEach(v=>v.play().catch(()=>{}));function draw(){const t=(performance.now()-start)/1000;if(t>=total){rec.stop();return}const v=vids[Math.floor(t/2)%vids.length],local=t%2;if(v.readyState>=2){const s=Math.max(360/v.videoWidth,640/v.videoHeight),w=v.videoWidth*s,h=v.videoHeight*s;ctx.fillStyle='#000';ctx.fillRect(0,0,360,640);ctx.drawImage(v,(360-w)/2,(640-h)/2,w,h)}requestAnimationFrame(draw)}draw();await new Promise((ok,no)=>{rec.onstop=ok;rec.onerror=e=>no(e.error||Error('Recorder error'))});src.stop();ms.getTracks().forEach(t=>t.stop());await ac.close();const blob=new Blob(chunks,{type:(rec.mimeType||mime).split(';')[0]}),u=URL.createObjectURL(blob),ext=(rec.mimeType||mime).includes('mp4')?'mp4':'webm';preview.src=u;preview.style.display='block';download.href=u;download.download='ai-shorts-'+Date.now()+'.'+ext;download.textContent='⬇️ DOWNLOAD VIDEO ANIMASI '+ext.toUpperCase();download.style.display='block';stat('🎉 VIDEO ANIMASI SELESAI!',100,'REAL AI FOOTAGE · '+urls.length+' clips · voice + video')}gb.onclick=async()=>{if(busy)return;busy=true;gb.disabled=true;try{await makeScript();await makeVoice();await makeVideos();await render()}catch(e){err(e)}finally{busy=false;gb.disabled=false}}})();</script></body></html>
