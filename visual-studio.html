<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Shorts Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 50px}.hero{text-align:center}.badge{display:inline-block;border:1px solid #343945;border-radius:99px;padding:7px 12px;font-size:11px;color:#c8cdd6}.hero h1{font-size:36px;margin:16px 0 7px}.hero p,.hint,.diag{color:#9299a5}.card{background:#101217;border:1px solid #252a33;border-radius:20px;padding:16px;margin-top:14px}.label{display:block;color:#bbc1cb;font-size:13px;margin:0 0 8px}input,textarea,select{width:100%;background:#090b0f;color:#fff;border:1px solid #2b3039;border-radius:13px;padding:13px;font:inherit}textarea{min-height:220px}.row{display:flex;gap:9px;margin-top:10px}.row>*{flex:1}.btn{width:100%;border:1px solid #343943;border-radius:13px;padding:14px;background:#191c22;color:#fff;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-appearance:none}.primary{background:#fff;color:#08090c;font-size:16px;margin-top:10px}.btn:disabled{opacity:.45}.status{margin-top:12px;padding:13px;border:1px solid #282d36;border-radius:13px;background:#0b0e13}.bar{height:7px;background:#252a33;border-radius:8px;margin-top:9px;overflow:hidden}.fill{height:100%;width:0;background:#fff}.diag{font-size:11px;white-space:pre-wrap;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.scene{background:#090b0f;border:1px solid #252a33;border-radius:13px;overflow:hidden}.scene img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}.scene small{display:block;padding:8px;color:#aeb6c2}.preview{display:block;width:100%;max-width:360px;aspect-ratio:9/16;margin:16px auto 0;background:#000;border-radius:16px}.download{display:block;background:#fff;color:#000;text-align:center;text-decoration:none;font-weight:900;padding:14px;border-radius:13px;margin-top:10px}.hint{font-size:12px;line-height:1.5}@media(max-width:600px){.row,.grid{display:flex;flex-direction:column}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">CHATGPT → VISUALS → VOICE → VIDEO</span><h1>Idea → Shorts</h1><p>Browser-safe renderer untuk iPhone.</p></section><section class="card"><label class="label">🎯 Topik</label><input id="topic" placeholder="Contoh: kebun kecil jadi produktif"><div class="row"><select id="lang"><option value="English">English</option><option value="Bahasa Indonesia">Bahasa Indonesia</option></select><button class="btn" id="scriptBtn" type="button">🧠 Script</button></div><button class="btn primary" id="generateBtn" type="button">🚀 GENERATE SEMUA</button><label class="label" style="margin-top:18px">📝 Script + Scene Plan</label><textarea id="script" placeholder="Script akan muncul di sini..."></textarea><div class="row"><button class="btn" id="voiceBtn" type="button">🔊 Generate Voice</button><button class="btn" id="visualBtn" type="button">🖼️ Cari Visual</button></div><div id="status" class="status" style="display:none"><b id="statusText">Preparing...</b><div class="bar"><div id="fill" class="fill"></div></div><div id="diag" class="diag"></div></div><div id="grid" class="grid"></div><audio id="audio" controls style="display:none;width:100%;margin-top:12px"></audio><canvas id="canvas" width="360" height="640" style="display:none"></canvas><video id="preview" class="preview" controls playsinline webkit-playsinline style="display:none"></video><a id="download" class="download" style="display:none"></a><p class="hint">Supertonic vocoder dilewati di iPhone karena macet saat load. Voice sekarang dibuat lewat TTS server fallback, lalu digabung dengan visual dan direkam menjadi video.</p></section></main><script>(function(){'use strict';const $=id=>document.getElementById(id),topic=$('topic'),script=$('script'),lang=$('lang'),status=$('status'),statusText=$('statusText'),fill=$('fill'),diag=$('diag'),grid=$('grid'),audio=$('audio'),canvas=$('canvas'),preview=$('preview'),download=$('download');let visuals=[],wavBlob=null,voiceDuration=0,busy=false;function stat(t,p,d=''){status.style.display='block';statusText.textContent=t;fill.style.width=Math.max(0,Math.min(100,p))+'%';diag.textContent=d}function fail(e){stat('❌ '+(e?.message||e),0,String(e?.stack||e))}function scenes(){let a=(script.value||'').split(/(?=SCENE\s*\d+)/i).filter(x=>x.trim());if(!a.length)a=[script.value];return a.slice(0,10).map((raw,i)=>({raw,i,n:(raw.match(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/i)||[])[1]?.trim()||'',v:(raw.match(/VISUAL\s*[:\-]\s*([\s\S]*?)(?=NARRATION|TIMING|SCENE\s*\d+|$)/i)||[])[1]?.trim()||''}))}function narration(){let a=[...script.value.matchAll(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/gi)].map(x=>x[1].trim()).filter(Boolean);if(a.length)return a.join(' ');return script.value.replace(/SCENE\s*\d+/gi,' ').replace(/VISUAL\s*[:\-][\s\S]*?(?=NARRATION|TIMING|$)/gi,' ').replace(/TIMING\s*[:\-][^\n]*/gi,' ').replace(/NARRATION\s*[:\-]/gi,' ').replace(/\s+/g,' ').trim()}async function makeScript(){if(!topic.value.trim())throw Error('Isi topik dulu.');$('scriptBtn').disabled=true;stat('🧠 Membuat script...',5);try{let r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:lang.value,duration:60})}),d=await r.json();if(!r.ok)throw Error(d.error||'Script gagal');script.value=d.script||'';visuals=[];grid.innerHTML='';wavBlob=null;voiceDuration=0;stat('✅ Script siap.',15)}finally{$('scriptBtn').disabled=false}}$('scriptBtn').onclick=async()=>{try{await makeScript()}catch(e){fail(e)}};function pcmWav(samples,sr){let b=new ArrayBuffer(44+samples.length*2),v=new DataView(b),ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws(0,'RIFF');v.setUint32(4,36+samples.length*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,samples[i]))*32767,true);return new Blob([b],{type:'audio/wav'})}async function serverVoice(){let text=narration();if(!text)throw Error('Narration kosong.');let parts=text.match(/.{1,170}(?:\s|$)/g)||[text],ac=new(window.AudioContext||window.webkitAudioContext)(),buffers=[];for(let i=0;i<parts.length;i++){stat('🗣️ Membuat voice '+(i+1)+'/'+parts.length+'...',20+(i/parts.length)*35,'Engine: server TTS fallback\nVocoder Supertonic: OFF');let r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:parts[i],lang:lang.value==='English'?'en':'id'})});if(!r.ok)throw Error('Server TTS HTTP '+r.status);buffers.push(await ac.decodeAudioData(await r.arrayBuffer()))}let sr=buffers[0].sampleRate,len=buffers.reduce((n,b)=>n+b.length,0),out=ac.createBuffer(1,len,sr),off=0;for(const b of buffers){out.getChannelData(0).set(b.getChannelData(0),off);off+=b.length}voiceDuration=out.duration;wavBlob=pcmWav(out.getChannelData(0),sr);audio.src=URL.createObjectURL(wavBlob);audio.style.display='block';await ac.close();stat('✅ Voice siap — '+voiceDuration.toFixed(1)+' detik.',60,'TTS: server fallback\nAudio: WAV\niPhone-safe: ON')}async function makeVoice(){$('voiceBtn').disabled=true;try{if(!script.value.trim())await makeScript();await serverVoice()}finally{$('voiceBtn').disabled=false}}$('voiceBtn').onclick=async()=>{try{await makeVoice()}catch(e){fail(e)}};function query(s){return String(s||topic.value).replace(/\b(scene|visual|footage|cinematic|b-roll|vertical|show)\b/gi,' ').replace(/\s+/g,' ').trim().slice(0,90)||topic.value.slice(0,90)}async function findImages(term){let u='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(term)+'&gsrnamespace=6&gsrlimit=8&prop=imageinfo&iiprop=url|mime&iiurlwidth=720&format=json&origin=*',r=await fetch(u);if(!r.ok)throw Error('Visual search HTTP '+r.status);let d=await r.json();return Object.values(d.query?.pages||{}).map(p=>{let x=p.imageinfo?.[0]||{};return{url:x.url||'',thumb:x.thumburl||x.url||'',mime:x.mime||''}}).filter(x=>x.thumb&&/^image\//i.test(x.mime))}async function buildVisuals(){let ss=scenes();visuals=[];grid.innerHTML='';for(let i=0;i<ss.length;i++){stat('🖼️ Mencari visual '+(i+1)+'/'+ss.length+'...',62+(i/ss.length)*25);let a=[];try{a=await findImages(query(ss[i].v||ss[i].n))}catch(e){}if(!a.length&&topic.value)try{a=await findImages(topic.value)}catch(e){}let item=a[0]||null;visuals[i]=item;let box=document.createElement('div');box.className='scene';if(item){let im=document.createElement('img');im.src=item.thumb;im.alt='scene '+(i+1);box.appendChild(im)}let sm=document.createElement('small');sm.textContent='Scene '+(i+1)+' · '+(item?'IMAGE + MOTION':'GRAPHIC FALLBACK');box.appendChild(sm);grid.appendChild(box)}stat('✅ Visual siap — '+visuals.filter(Boolean).length+'/'+ss.length+'.',88,'Ken Burns zoom/pan: ON\nSubtitle: ON');return ss}$('visualBtn').onclick=async()=>{try{await buildVisuals()}catch(e){fail(e)}};function loadImage(item){return new Promise(res=>{if(!item)return res(null);let im=new Image();im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=item.thumb||item.url})}function subtitle(ctx,s){ctx.font='700 23px -apple-system,BlinkMacSystemFont,sans-serif';let words=String(s||'').replace(/\s+/g,' ').trim().split(' '),lines=[],line='';for(const w of words){let z=line?line+' '+w:w;if(ctx.measureText(z).width>320&&line){lines.push(line);line=w;if(lines.length===3)break}else line=z}if(line&&lines.length<3)lines.push(line);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=9;lines.forEach((x,i)=>ctx.fillText(x,180,530+i*29));ctx.shadowBlur=0}async function render(){if(busy)return;busy=true;$('generateBtn').disabled=true;try{if(!script.value.trim())await makeScript();if(!wavBlob)await makeVoice();let ss=scenes();if(!visuals.length)await buildVisuals();let imgs=[];for(const x of visuals)imgs.push(await loadImage(x));let ctx=canvas.getContext('2d'),stream=canvas.captureStream(24),ac=new(window.AudioContext||window.webkitAudioContext)(),dest=ac.createMediaStreamDestination(),ab=await ac.decodeAudioData(await wavBlob.arrayBuffer()),src=ac.createBufferSource();src.buffer=ab;src.connect(dest);let combined=new MediaStream([...stream.getVideoTracks(),...dest.stream.getAudioTracks()]),mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('MediaRecorder video tidak tersedia.');stat('🎬 Merekam video...',90,'Format: '+mime+'\nVisual: '+imgs.filter(Boolean).length+'/'+ss.length+'\nAudio: ON');let rec=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:1800000,audioBitsPerSecond:96000}),chunks=[];rec.ondataavailable=e=>e.data?.size&&chunks.push(e.data);let stopped=new Promise((ok,no)=>{rec.onstop=ok;rec.onerror=()=>no(Error('MediaRecorder gagal'))});rec.start(250);src.start();let total=Math.max(1,voiceDuration*1000),start=performance.now();function draw(now){let el=Math.min(total,now-start),p=el/total*ss.length,idx=Math.min(ss.length-1,Math.floor(p)),ph=p-idx,im=imgs[idx];ctx.fillStyle='#090b0f';ctx.fillRect(0,0,360,640);if(im){let w=im.naturalWidth,h=im.naturalHeight,scale=Math.max(360/w,640/h)*(1+ph*.08),dw=w*scale,dh=h*scale;ctx.drawImage(im,(360-dw)/2+(ph-.5)*18,(640-dh)/2)}ctx.fillStyle='rgba(0,0,0,.24)';ctx.fillRect(0,0,360,640);subtitle(ctx,ss[idx]?.n||'');ctx.fillStyle='#fff';ctx.font='700 12px sans-serif';ctx.textAlign='left';ctx.fillText('SCENE '+(idx+1),14,24);ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(14,620,332,3);ctx.fillStyle='#fff';ctx.fillRect(14,620,332*(el/total),3);stat('🎬 Merekam '+Math.floor(el/1000)+' / '+Math.ceil(total/1000)+' detik...',90+(el/total)*9,'Format: '+mime+'\nCanvas: 360×640\nAudio: ON');if(el<total)requestAnimationFrame(draw);else{rec.stop();stream.getTracks().forEach(t=>t.stop());src.stop();ac.close()}}requestAnimationFrame(draw);await stopped;let blob=new Blob(chunks,{type:mime.split(';')[0]});preview.src=URL.createObjectURL(blob);preview.style.display='block';let ext=mime.startsWith('video/mp4')?'mp4':'webm';download.href=preview.src;download.download='ai-shorts.'+ext;download.textContent='⬇️ DOWNLOAD VIDEO ('+ext.toUpperCase()+')';download.style.display='block';stat('✅ VIDEO SELESAI!',100,'File: '+(blob.size/1024/1024).toFixed(1)+' MB\nVisual + subtitle + voice: ON')}finally{$('generateBtn').disabled=false;busy=false}}$('generateBtn').onclick=async()=>{try{await render()}catch(e){fail(e)}}})();</script></body></html>
