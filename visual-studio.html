<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Shorts Studio — Real AI Video</title><style>*{box-sizing:border-box}body{margin:0;background:#07080b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 50px}.hero{text-align:center}.badge{display:inline-block;border:1px solid #343945;border-radius:99px;padding:7px 12px;font-size:11px;color:#c8cdd6}.hero h1{font-size:32px;margin:16px 0 7px}.hero p,.hint,.diag{color:#9299a5}.card{background:#101217;border:1px solid #252a33;border-radius:20px;padding:16px;margin-top:14px}.label{display:block;color:#bbc1cb;font-size:13px;margin:0 0 8px}input,textarea,select{width:100%;background:#090b0f;color:#fff;border:1px solid #2b3039;border-radius:13px;padding:13px;font:inherit}textarea{min-height:230px}.row{display:flex;gap:9px;margin-top:10px}.row>*{flex:1}.btn{width:100%;border:1px solid #343943;border-radius:13px;padding:14px;background:#191c22;color:#fff;font-weight:800;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-appearance:none}.primary{background:#fff;color:#08090c;font-size:16px;margin-top:10px}.btn:disabled{opacity:.45}.status{margin-top:12px;padding:13px;border:1px solid #282d36;border-radius:13px;background:#0b0e13}.bar{height:7px;background:#252a33;border-radius:8px;margin-top:9px;overflow:hidden}.fill{height:100%;width:0;background:#fff}.diag{font-size:11px;white-space:pre-wrap;margin-top:8px}.clips{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:13px}.clip{background:#090b0f;border:1px solid #252a33;border-radius:13px;overflow:hidden}.clip video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#000}.clip small{display:block;padding:8px;color:#aeb6c2}.preview{display:block;width:100%;max-width:360px;aspect-ratio:9/16;margin:16px auto 0;background:#000;border-radius:16px}.download{display:block;background:#fff;color:#000;text-align:center;text-decoration:none;font-weight:900;padding:14px;border-radius:13px;margin-top:10px}.hint{font-size:12px;line-height:1.5}@media(max-width:600px){.row,.clips{display:flex;flex-direction:column}}</style></head><body><main class="wrap"><section class="hero"><span class="badge">CHATGPT → PYRAMID FLOW → WAN FALLBACK → VOICE → MP4</span><h1>Idea → Shorts</h1><p>AI video sungguhan — bukan gambar yang digerakkan.</p></section><section class="card"><label class="label">🎯 Topik video</label><input id="topic" placeholder="Contoh: sejarah Ka'bah dalam 60 detik"><div class="row"><select id="lang"><option>Bahasa Indonesia</option><option>English</option></select><button class="btn" id="scriptBtn" type="button">🧠 Script</button></div><button class="btn primary" id="generateBtn" type="button">🚀 GENERATE VIDEO AI</button><label class="label" style="margin-top:18px">📝 Script + Scene Plan</label><textarea id="script" placeholder="Script akan muncul di sini..."></textarea><div class="row"><button class="btn" id="voiceBtn" type="button">🔊 Generate Voice</button><button class="btn" id="videoBtn" type="button">🎬 Generate AI Footage</button></div><div id="status" class="status" style="display:none"><b id="statusText">Preparing...</b><div class="bar"><div id="fill" class="fill"></div></div><div id="diag" class="diag"></div></div><div id="clips" class="clips"></div><audio id="audio" controls style="display:none;width:100%;margin-top:12px"></audio><canvas id="canvas" width="360" height="640" style="display:none"></canvas><video id="preview" class="preview" controls playsinline webkit-playsinline style="display:none"></video><a id="download" class="download" style="display:none"></a><p class="hint"><b>Free GPU:</b> Pyramid Flow dipakai dulu. Jika Space sedang penuh/gagal, otomatis pindah ke Wan 2.2.</p></section></main><script>(function(){'use strict';const $=id=>document.getElementById(id),topic=$('topic'),script=$('script'),lang=$('lang'),status=$('status'),statusText=$('statusText'),fill=$('fill'),diag=$('diag'),clips=$('clips'),audio=$('audio'),canvas=$('canvas'),preview=$('preview'),download=$('download'),scriptBtn=$('scriptBtn'),voiceBtn=$('voiceBtn'),videoBtn=$('videoBtn'),generateBtn=$('generateBtn');const ENGINES=[{name:'Pyramid Flow',url:'https://pyramid-flow-pyramid-flow.hf.space',type:'pyramid'},{name:'Wan 2.2 A',url:'https://kpkp21-wan2-video-generation.hf.space',type:'wan'},{name:'Wan 2.2 B',url:'https://openking-wan2-video-generation.hf.space',type:'wan'}];let wavBlob=null,aiClips=[],busy=false;const sleep=ms=>new Promise(r=>setTimeout(r,ms));function stat(t,p,d=''){status.style.display='block';statusText.textContent=t;fill.style.width=Math.max(0,Math.min(100,p))+'%';diag.textContent=d}function fail(e){stat('❌ '+(e?.message||e),0,String(e?.stack||e))}function scenes(){const a=(script.value||'').split(/(?=SCENE\s*\d+)/i).filter(x=>x.trim());return(a.length?a:[script.value]).slice(0,8).map((raw,i)=>({i,n:(raw.match(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/i)||[])[1]?.trim()||'',v:(raw.match(/VISUAL\s*[:\-]\s*([\s\S]*?)(?=NARRATION|TIMING|SCENE\s*\d+|$)/i)||[])[1]?.trim()||''}))}function narration(){const a=[...script.value.matchAll(/NARRATION\s*[:\-]\s*([\s\S]*?)(?=VISUAL|TIMING|SCENE\s*\d+|$)/gi)].map(x=>x[1].trim()).filter(Boolean);return a.length?a.join(' '):script.value.replace(/SCENE\s*\d+/gi,' ').replace(/VISUAL\s*[:\-][\s\S]*?(?=NARRATION|TIMING|$)/gi,' ').replace(/TIMING\s*[:\-][^\n]*/gi,' ').replace(/NARRATION\s*[:\-]/gi,' ').replace(/\s+/g,' ').trim()}async function makeScript(){if(!topic.value.trim())throw Error('Isi topik dulu.');scriptBtn.disabled=true;stat('🧠 Membuat script + scene...',5);try{const r=await fetch('/api/chatgpt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:topic.value,language:lang.value,duration:60})}),d=await r.json();if(!r.ok)throw Error(d.error||'Script gagal');script.value=d.script||'';aiClips=[];clips.innerHTML='';wavBlob=null;stat('✅ Script siap — '+scenes().length+' scene.',12)}finally{scriptBtn.disabled=false}}scriptBtn.onclick=async()=>{try{await makeScript()}catch(e){fail(e)}};function pcmWav(samples,sr){const b=new ArrayBuffer(44+samples.length*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+samples.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,samples.length*2,true);for(let i=0;i<samples.length;i++)v.setInt16(44+i*2,Math.max(-1,Math.min(1,samples[i]))*32767,true);return new Blob([b],{type:'audio/wav'})}async function makeVoice(){if(!script.value.trim())await makeScript();const text=narration();if(!text)throw Error('Narration kosong.');voiceBtn.disabled=true;const parts=text.match(/.{1,170}(?:\s|$)/g)||[text],AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),buf=[];try{for(let i=0;i<parts.length;i++){stat('🗣️ Voice '+(i+1)+'/'+parts.length+'...',15+(i/parts.length)*25,'TTS server fallback · iPhone-safe');const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:parts[i],lang:lang.value==='English'?'en':'id'})});if(!r.ok)throw Error('TTS HTTP '+r.status);buf.push(await ac.decodeAudioData(await r.arrayBuffer()))}const sr=buf[0].sampleRate,len=buf.reduce((n,b)=>n+b.length,0),out=ac.createBuffer(1,len,sr);let off=0;for(const b of buf){out.getChannelData(0).set(b.getChannelData(0),off);off+=b.length}wavBlob=pcmWav(out.getChannelData(0),sr);audio.src=URL.createObjectURL(wavBlob);audio.style.display='block';stat('✅ Voice siap — '+out.duration.toFixed(1)+' detik.',40,'TTS server fallback · WAV · iPhone-safe')}finally{await ac.close();voiceBtn.disabled=false}}voiceBtn.onclick=async()=>{try{await makeVoice()}catch(e){fail(e)}};function promptFor(s,i){return 'Cinematic real moving video footage, realistic physics, continuous natural motion, natural human movement, subtle camera movement, detailed environment. '+String(s.v||s.n||'').replace(/\s+/g,' ').trim()+'. No still image, no slideshow, no text, no subtitles, no logos. Scene '+(i+1)+' of a documentary about '+topic.value+'.'}async function pyramidSubmit(prompt){const base=[null,prompt,3,9,5,8];for(const data of [base,base.slice(0,5)]){const r=await fetch(ENGINES[0].url+'/gradio_api/call/generate_video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});if(r.ok){const j=await r.json();if(j.event_id)return j.event_id}if(![400,422,429,502,503].includes(r.status))throw Error('Pyramid HTTP '+r.status);await sleep(1500)}throw Error('Pyramid HTTP 503/queue unavailable')}async function submit(engine,prompt){if(engine.type==='pyramid')return pyramidSubmit(prompt);const data=[prompt,null,1280,704,73,25,5,-1],r=await fetch(engine.url+'/gradio_api/call/generate_video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});if(!r.ok)throw Error(engine.name+' HTTP '+r.status);const j=await r.json();if(!j.event_id)throw Error('No event_id');return j.event_id}async function stream(engine,id){for(let k=0;k<24;k++){const r=await fetch(engine.url+'/gradio_api/call/generate_video/'+encodeURIComponent(id));if(r.ok){const text=await r.text(),lines=text.split(/\r?\n/).filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim()).filter(Boolean);for(const raw of lines.reverse()){if(raw==='[DONE]')continue;let o;try{o=JSON.parse(raw)}catch{continue}if(Array.isArray(o)&&o.length)o=o[0];const u=o?.url||o?.video?.url||o?.video?.path||o?.path||(typeof o==='string'?o:'');if(u)return /^https?:/i.test(u)?u:engine.url+'/file='+u}throw Error('Video URL kosong')}if([429,502,503].includes(r.status)){await sleep(5000);continue}throw Error(engine.name+' stream HTTP '+r.status)}throw Error(engine.name+' GPU queue timeout')}async function oneClip(prompt,i){let last;for(const engine of ENGINES){for(let a=1;a<=2;a++){stat('🎬 '+engine.name+' — scene '+(i+1)+' · attempt '+a+'/2',42+i*.1,engine.type==='pyramid'?'3 detik · 8fps canonical · free ZeroGPU':'1280×704 · 73 frames · free ZeroGPU');try{const id=await submit(engine,prompt);stat('⏳ '+engine.name+' scene '+(i+1)+' — GPU aktif',45+i*.1,'Menunggu hasil video AI...');return await stream(engine,id)}catch(e){last=e;if(a<2)await sleep(5000)}}}throw last||Error('Semua free video engine gagal')}async function generateAIClips(){if(!script.value.trim())await makeScript();const ss=scenes();aiClips=[];clips.innerHTML='';videoBtn.disabled=true;try{for(let i=0;i<ss.length;i++){const url=await oneClip(promptFor(ss[i],i),i);aiClips.push(url);const box=document.createElement('div');box.className='clip';const v=document.createElement('video');v.src=url;v.controls=true;v.playsInline=true;v.muted=true;box.appendChild(v);const sm=document.createElement('small');sm.textContent='Scene '+(i+1)+' · REAL AI VIDEO';box.appendChild(sm);clips.appendChild(box);stat('✅ Scene '+(i+1)+'/'+ss.length+' selesai.',45+(i+1)/ss.length*45,'Footage AI nyata · bukan slideshow')} }finally{videoBtn.disabled=false}}videoBtn.onclick=async()=>{try{await generateAIClips()}catch(e){fail(e)}};async function renderFinal(){if(!aiClips.length)await generateAIClips();if(!wavBlob)await makeVoice();generateBtn.disabled=true;const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();if(ac.state==='suspended')await ac.resume();const decoded=await ac.decodeAudioData(await wavBlob.arrayBuffer()),src=ac.createBufferSource(),dest=ac.createMediaStreamDestination();src.buffer=decoded;src.connect(dest);const vids=[];for(const u of aiClips){const v=document.createElement('video');v.src=u;v.crossOrigin='anonymous';v.muted=true;v.playsInline=true;v.preload='auto';await new Promise((res,no)=>{v.onloadedmetadata=res;v.onerror=()=>no(Error('Clip video gagal dimuat'))});vids.push(v)}const ctx=canvas.getContext('2d'),vs=canvas.captureStream(24),stream=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]),mime=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));if(!mime)throw Error('MediaRecorder video tidak tersedia.');const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:2200000,audioBitsPerSecond:128000}),chunks=[];rec.ondataavailable=e=>e.data?.size&&chunks.push(e.data);const total=decoded.duration,each=3;let done=new Promise((res,no)=>{rec.onstop=res;rec.onerror=e=>no(e.error||Error('Recorder error'))});rec.start(250);src.start();const started=performance.now();function draw(){const t=(performance.now()-started)/1000;if(t>=total){try{rec.stop()}catch{}return}const idx=Math.floor(t/each)%vids.length,v=vids[idx],local=t%each;if(v.readyState>=2){if(Math.abs(v.currentTime-local)>.12)v.currentTime=local;const scale=Math.max(360/v.videoWidth,640/v.videoHeight),dw=v.videoWidth*scale,dh=v.videoHeight*scale;ctx.fillStyle='#000';ctx.fillRect(0,0,360,640);ctx.drawImage(v,(360-dw)/2,(640-dh)/2,dw,dh)}requestAnimationFrame(draw)}vids.forEach(v=>v.play().catch(()=>{}));draw();await done;src.stop();stream.getTracks().forEach(t=>t.stop());await ac.close();const type=rec.mimeType||mime,blob=new Blob(chunks,{type:type.split(';')[0]});if(blob.size<10000)throw Error('Final video kosong.');const u=URL.createObjectURL(blob),ext=type.includes('mp4')?'mp4':'webm';preview.src=u;preview.style.display='block';download.href=u;download.download='ai-shorts-'+Date.now()+'.'+ext;download.textContent='⬇️ DOWNLOAD VIDEO ANIMASI '+ext.toUpperCase();download.style.display='block';stat('🎉 VIDEO ANIMASI SELESAI!',100,'REAL AI FOOTAGE · '+vids.length+' clips · voice + video digabung')}generateBtn.onclick=async()=>{if(busy)return;busy=true;generateBtn.disabled=true;try{await makeScript();await makeVoice();await generateAIClips();await renderFinal()}catch(e){fail(e)}finally{busy=false;generateBtn.disabled=false}}})();</script></body></html>
