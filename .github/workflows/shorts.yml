name: Auto YouTube Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run Shorts Generator
        run: python main.py

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: shorts.mp4
